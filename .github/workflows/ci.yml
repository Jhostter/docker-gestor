name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # Arranca el servidor compilado sin Docker: comprueba que funciona en cada sistema operativo.
      - run: npm run smoke
      - run: npm run e2e:alerts
        if: runner.os == 'Linux'
      - run: npm run e2e:disk
        if: runner.os == 'Linux'
      - run: npm run e2e:detail
        if: runner.os == 'Linux'
